# Builds Human Typer as a real app for Mac and Windows.
#
# Every pull request and every push to main builds the apps (you can download them from the
# run's "Artifacts" section). Pushes to main also publish them on the
# repository's Releases page, so anyone can download them from there.

name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: Mac-AppleSilicon
          - os: macos-15-intel
            label: Mac-Intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        # --only-binary: use a ready-made cryptography (it carries its own OpenSSL). Building it from
        # source on Intel Macs links a different OpenSSL than the app bundles, and the app then crashes.
        run: python -m pip install --only-binary=cryptography pyinstaller pillow -r requirements.txt

      - name: Check the window library and Word reader work
        run: |
          python -c "import tkinter; tkinter.Tcl(); print('tkinter ok')"
          python -c "import docx; d = docx.Document(); d.add_table(rows=2, cols=2); d.save('t.docx')"
          python -c "import human_typer as h; c = h.read_word_cells('t.docx'); assert len(c) == 4, c; print('word reader ok')"
          python -c "import human_typer as h; i = h.check_text('i went to teh shop and we was tired'); print([d['suggestion'] for d in i]); assert any(d['suggestion'] == 'the' for d in i); print('checker ok')"

      - name: Run the tests
        # Typing plans, the typist, the checker, settings, the Claude link. (The window
        # tests need a screen, so they're run by hand: see tests/test_human_typer.py.)
        run: python -m unittest discover -s tests -v

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "Human Typer" --icon icon.png --add-data "icon.png;." \
            --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 \
            --hidden-import win32com.client --hidden-import pythoncom --collect-data docx --collect-data spellchecker --collect-data certifi --collect-submodules mcp.server --collect-submodules mcp.shared --hidden-import anyio._backends._asyncio \
            human_typer.py
          # The terminal version: a console app, so it runs in Command Prompt / PowerShell.
          python -m PyInstaller --noconfirm --onefile --console \
            --name "Human Typer CLI" --icon icon.png \
            --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 \
            --hidden-import win32com.client --hidden-import pythoncom --collect-data docx --collect-data spellchecker --collect-data certifi \
            human_typer_cli.py
          mkdir out
          cp "dist/Human Typer.exe" "out/HumanTyper-Windows.exe"
          cp "dist/Human Typer CLI.exe" "out/HumanTyper-CLI-Windows.exe"
          # The same apps in a zip, with instructions, for apps that won't send .exe files.
          python -c "import zipfile; z = zipfile.ZipFile('out/HumanTyper-Windows.zip', 'w', zipfile.ZIP_DEFLATED); z.write('dist/Human Typer.exe', 'Human Typer/Human Typer.exe'); z.write('dist/Human Typer CLI.exe', 'Human Typer/Human Typer CLI.exe'); z.write('packaging/READ ME FIRST.txt', 'Human Typer/READ ME FIRST.txt'); z.close()"

      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --name "Human Typer" --icon icon.png --add-data "icon.png:." \
            --osx-bundle-identifier com.xtroychaos.humantyper \
            --hidden-import pynput.keyboard._darwin --hidden-import pynput.mouse._darwin \
            --hidden-import HIServices --hidden-import Foundation --collect-data docx --collect-data spellchecker --collect-data certifi --collect-submodules mcp.server --collect-submodules mcp.shared --hidden-import anyio._backends._asyncio \
            human_typer.py
          # Lets the Mac ask "Human Typer wants to control Microsoft Word", then re-signs the app.
          plutil -insert NSAppleEventsUsageDescription -string \
            "Human Typer moves Word's cursor into the table cells you pick, so it can type your answers there." \
            "dist/Human Typer.app/Contents/Info.plist"
          codesign --force --deep --sign - "dist/Human Typer.app"
          mkdir out
          ditto -c -k --keepParent "dist/Human Typer.app" "out/HumanTyper-${{ matrix.label }}.zip"

      - name: Self-test inside the built app (dictionary, Word reader, Claude library, secure connection)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then APP="dist/Human Typer.exe"; else APP="dist/Human Typer.app/Contents/MacOS/Human Typer"; fi
          "$APP" --selftest --net
          echo "self-test passed"
          python tests/mcp_smoke.py "$APP" --mcp

      - name: Quick check that the app starts
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then APP="dist/Human Typer.exe"; else APP="dist/Human Typer.app/Contents/MacOS/Human Typer"; fi
          "$APP" & PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "App is running"; kill $PID || true; else wait $PID; echo "App quit early (code $?)"; exit 1; fi

      - name: Quick check that the terminal version starts
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then CLI="dist/Human Typer CLI.exe"; ARG=""; else CLI="dist/Human Typer.app/Contents/MacOS/Human Typer"; ARG="--cli"; fi
          printf '?\n\nq\n' | "$CLI" $ARG > cli.txt
          cat cli.txt
          grep -q "HOW IT WORKS" cli.txt && grep -q "Bye" cli.txt && echo "terminal version ok"

      - uses: actions/upload-artifact@v4
        with:
          name: HumanTyper-${{ matrix.label }}
          path: out/*

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --target "$GITHUB_SHA" --title "Human Typer" --notes "Download the file for your computer:

          - **Mac with an M1/M2/M3/M4 chip** (most Macs from 2021 on): HumanTyper-Mac-AppleSilicon.zip
          - **Older Mac with an Intel chip**: HumanTyper-Mac-Intel.zip
          - **Windows**: HumanTyper-Windows.exe (or HumanTyper-Windows.zip to send to someone: extract it, then open Human Typer.exe)
          - **Terminal version**: Windows: HumanTyper-CLI-Windows.exe (double-click it, or run it from Command Prompt or PowerShell). Mac: in Terminal run  \"/Applications/Human Typer.app/Contents/MacOS/Human Typer\" --cli

          Not sure which Mac you have? Apple menu > About This Mac: it says Chip (Apple M...) or Processor (Intel).

          See the README for first-time setup."
